<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#0066cc">
  <meta name="description" content="OBSIDIAN - Collaborative Platform">
  
  <!-- App title (will be overridden by router) -->
  <title>OBSIDIAN</title>

  <!-- Favicon -->
  <link rel="icon" href="/assets/icons/favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/assets/icons/icon-192.png">
  
  <!-- Manifest for PWA support -->
  <link rel="manifest" href="/manifest.webmanifest">

  <!-- Base styles (CSS layers) -->
  <link rel="stylesheet" href="/styles/responsive.css">
  <link rel="stylesheet" href="/styles/components.css">

  <!-- No external dependencies per OBSIDIAN architecture -->
  <noscript>
    <p>OBSIDIAN requires JavaScript. Please enable JavaScript in your browser.</p>
  </noscript>
</head>
<body>
  <!-- Skip link (accessibility) -->
  <a href="#main-content" class="pf-skip-link">Skip to main content</a>

  <!-- App shell -->
  <pf-app-shell>
    <!-- Header -->
    <header role="banner" slot="header">
      <pf-app-header></pf-app-header>
    </header>

    <!-- Navigation -->
    <nav role="navigation" slot="nav" aria-label="Main navigation">
      <pf-app-nav></pf-app-nav>
    </nav>

    <!-- Main content -->
    <main id="main-content" role="main" slot="content" tabindex="-1">
      <!-- Router outlet (dynamic content) -->
      <div id="app-outlet"></div>
    </main>

    <!-- Breadcrumbs -->
    <nav aria-label="breadcrumb" data-breadcrumbs slot="breadcrumbs"></nav>
  </pf-app-shell>

  <!-- Toast container (for notifications) -->
  <div class="pf-toast-container" role="region" aria-label="Notifications" aria-live="polite"></div>

  <!-- Modal backdrop -->
  <div id="modal-root"></div>

  <!-- App initialization script -->
  <script type="module" src="/core/boot.js"></script>
</body>
</html>
